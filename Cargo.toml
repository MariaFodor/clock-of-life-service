[package]
name = "clock-of-life-service"
version = "0.1.0"
edition = "2021"
description = "The Clock of Life — Rust scoring service. Loads a model artifact bundle and serves estimates."

[lib]
name = "clock_of_life_service"
path = "src/lib.rs"

[[bin]]
name = "clock-of-life-service"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "derive", "macros", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
jsonwebtoken = "9"
tower-http = { version = "0.6", features = ["fs", "trace"] }
tower = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 2
