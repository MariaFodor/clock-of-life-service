[package]
name = "clock-of-life-service"
version = "0.1.0"
edition = "2021"
description = "The Clock of Life — Rust scoring service. Loads a model artifact bundle and serves estimates."

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 2
